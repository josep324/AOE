# Proves del joc a cada push i pull request: comprovació del codi, compilació i proves al navegador
name: Proves
on:
  push:
  pull_request:
jobs:
  proves:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
